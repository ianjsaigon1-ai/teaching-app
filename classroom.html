<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor Ian Effect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }
        
        .welcome-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .time-stamp {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 10px;
            color: white;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }
        
        .logo-container {
            position: relative;
            z-index: 3;
            text-align: center;
            max-width: 90%;
            opacity: 0;
            animation: fadeIn 2s ease-out forwards;
            animation-delay: 0.5s;
        }
        
        .logo-image {
            max-width: 600px;
            width: 90%;
            height: auto;
            margin-bottom: 2rem;
        }
        
        .subtitle {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffd166;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            opacity: 0;
            animation: fadeIn 2s ease-out forwards;
            animation-delay: 2s;
        }
        
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        
        @media (max-width: 768px) {
            .logo-image {
                max-width: 400px;
            }
            
            .subtitle {
                font-size: 1.4rem;
            }
        }
        
        @media (max-width: 480px) {
            .logo-image {
                max-width: 300px;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="time-stamp">
            <div id="current-date"></div>
            <div id="current-time"></div>
        </div>
        
        <div class="logo-container">
            <!-- Replace this with your actual logo file -->
            <div style="color: #ffd166; font-size: 4rem; font-weight: bold; margin-bottom: 2rem;">
                Tutor Ian Effect
            </div>
            <p class="subtitle">Experience the transformation in learning</p>
        </div>
    </div>

    <script>
        // Update date and time
        function updateDateTime() {
            const now = new Date();
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit' };
            
            document.getElementById('current-date').textContent = now.toLocaleDateString('en-US', dateOptions);
            document.getElementById('current-time').textContent = now.toLocaleTimeString('en-US', timeOptions);
        }
        
        // Update time every second
        setInterval(updateDateTime, 1000);
        updateDateTime();
    </script>
</body>
</html>
