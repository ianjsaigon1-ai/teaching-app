<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Ian's Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .tool-icon.active { 
            background-color: #4A5568; 
            color: white; 
        }
        .tool-content { 
            display: none; 
            height: 100%;
        }
        .tool-content.active { 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
        }
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #main-content {
            flex: 1;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .external-link-btn {
            background: #3b82f6;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        .external-link-btn:hover {
            background: #2563eb;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-gray-800 text-white h-screen flex flex-col">
    <header class="bg-gray-900 text-white p-4 text-center shadow-md">
        <h1 class="text-2xl font-bold">Teacher's Dashboard</h1>
    </header>
    <div class="flex flex-1 overflow-hidden">
        <nav class="bg-gray-900 p-2 flex flex-col items-center space-y-4">
            <button onclick="showTool('flashcards')" class="tool-icon active p-3 rounded-lg hover:bg-gray-700" title="Flash Cards">
                <i class="fas fa-clone fa-2x"></i>
            </button>
            <button onclick="showTool('whiteboard')" class="tool-icon p-3 rounded-lg hover:bg-gray-700" title="Whiteboard">
                <i class="fas fa-chalkboard-teacher fa-2x"></i>
            </button>
            <button onclick="showTool('translator')" class="tool-icon p-3 rounded-lg hover:bg-gray-700" title="Translator">
                <i class="fas fa-language fa-2x"></i>
            </button>
            <button onclick="showTool('reading')" class="tool-icon p-3 rounded-lg hover:bg-gray-700" title="Reading">
                <i class="fas fa-book-open fa-2x"></i>
            </button>
            <button onclick="showTool('awards')" class="tool-icon p-3 rounded-lg hover:bg-gray-700" title="Awards">
                <i class="fas fa-star fa-2x"></i>
            </button>
            <button onclick="showTool('reports')" class="tool-icon p-3 rounded-lg hover:bg-gray-700" title="Reports">
                <i class="fas fa-chart-bar fa-2x"></i>
            </button>
        </nav>
        
        <main id="main-content" class="flex-1 overflow-hidden">
            <!-- Flashcards Tool -->
            <div id="flashcards-tool" class="tool-content active">
                <iframe src="https://ianjsaigon1-ai.github.io/flashcardsapp/"></iframe>
            </div>
            
            <!-- Whiteboard Tool - FIXED with working whiteboard -->
            <div id="whiteboard-tool" class="tool-content">
                <iframe src="https://witeboard.com/"></iframe>
            </div>
            
            <!-- Translator Tool -->
            <div id="translator-tool" class="tool-content">
                <iframe src="https://ianjsaigon1-ai.github.io/my-translator-app/"></iframe>
            </div>
            
            <!-- Reading Tool - FIXED with working alternatives -->
            <div id="reading-tool" class="tool-content">
                <div class="h-full flex flex-col items-center justify-center p-8 space-y-6">
                    <h2 class="text-3xl font-bold mb-4">Children's Reading Resources</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-4xl">
                        <!-- Storynory Link -->
                        <div class="bg-gray-700 p-6 rounded-lg text-center">
                            <h3 class="text-xl font-bold mb-3">Storynory Audio Stories</h3>
                            <p class="mb-4">Free audio stories for children</p>
                            <button onclick="window.open('https://www.storynory.com/', '_blank')" class="external-link-btn">
                                Open Storynory
                            </button>
                        </div>
                        
                        <!-- Storyline Online -->
                        <div class="bg-gray-700 p-6 rounded-lg text-center">
                            <h3 class="text-xl font-bold mb-3">Storyline Online</h3>
                            <p class="mb-4">Videos of celebrated actors reading children's books</p>
                            <button onclick="window.open('https://storylineonline.net/', '_blank')" class="external-link-btn">
                                Open Storyline
                            </button>
                        </div>
                        
                        <!-- International Children's Library -->
                        <div class="bg-gray-700 p-6 rounded-lg text-center">
                            <h3 class="text-xl font-bold mb-3">Children's Digital Library</h3>
                            <p class="mb-4">Books from around the world</p>
                            <button onclick="window.open('http://en.childrenslibrary.org/', '_blank')" class="external-link-btn">
                                Open Library
                            </button>
                        </div>
                        
                        <!-- Free Kids Books -->
                        <div class="bg-gray-700 p-6 rounded-lg text-center">
                            <h3 class="text-xl font-bold mb-3">Free Kids Books</h3>
                            <p class="mb-4">Free downloadable books</p>
                            <button onclick="window.open('https://freekidsbooks.org/', '_blank')" class="external-link-btn">
                                Open Free Books
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Awards Tool -->
            <div id="awards-tool" class="tool-content">
                <iframe src="https://ianjsaigon1-ai.github.io/my-rewards-app/"></iframe>
            </div>
            
            <!-- Reports Tool -->
            <div id="reports-tool" class="tool-content">
                <iframe src="https://ianjsaigon1-ai.github.io/my-reports-app/"></iframe>
            </div>
        </main>
    </div>
    <script>
        function showTool(toolId) {
            // Hide all tool contents
            document.querySelectorAll('.tool-content').forEach(tool => {
                tool.classList.remove('active');
            });
            
            // Show the selected tool content
            document.getElementById(toolId + '-tool').classList.add('active');
            
            // Update active button styling
            document.querySelectorAll('.tool-icon').forEach(icon => {
                icon.classList.remove('active');
            });
            
            // Find the button that was clicked and add active class
            const clickedButton = document.querySelector(`button[onclick="showTool('${toolId}')"]`);
            if (clickedButton) {
                clickedButton.classList.add('active');
            }
        }
        
        // Initialize with flashcards tool active
        showTool('flashcards');
    </script>
</body>
</html>
