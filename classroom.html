<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Ian's All-in-One Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* --- GLOBAL DASHBOARD STYLES --- */
        body { font-family: 'Poppins', sans-serif; }
        .tool-icon.active { background-color: #4A5568; color: white; }
        .tool-content { display: none; height: 100%; overflow-y: auto; }
        .tool-content.active { display: block; }

        /* --- STYLES FOR EACH BUILT-IN TOOL --- */
        /* (All the specific CSS for flashcards, translator, etc. would go here) */
    </style>
</head>
<body class="bg-gray-800 text-white h-screen flex flex-col">
    <header class="bg-gray-900 text-white p-4 text-center shadow-md">
        <h1 class="text-2xl font-bold">Mr. Ian's All-in-One Dashboard</h1>
    </header>
    <div class="flex flex-1 overflow-hidden">
        <nav class="bg-gray-900 p-2 flex flex-col items-center space-y-4">
            <button onclick="showTool('welcome')" class="tool-icon active"><i class="fas fa-home fa-2x"></i></button>
            <button onclick="showTool('flashcards')" class="tool-icon"><i class="fas fa-clone fa-2x"></i></button>
            <button onclick="showTool('whiteboard')" class="tool-icon"><i class="fas fa-chalkboard-teacher fa-2x"></i></button>
            <button onclick="showTool('translator')" class="tool-icon"><i class="fas fa-language fa-2x"></i></button>
            <button onclick="showTool('reading')" class="tool-icon"><i class="fas fa-book-open fa-2x"></i></button>
            <button onclick="showTool('awards')" class="tool-icon"><i class="fas fa-star fa-2x"></i></button>
            <button onclick="showTool('reports')" class="tool-icon"><i class="fas fa-chart-bar fa-2x"></i></button>
        </nav>
        
        <main id="main-content" class="flex-1 overflow-hidden">
            <div id="welcome-tool" class="tool-content active p-4 text-center flex flex-col justify-center items-center h-full">
                 <h2 class="text-4xl font-bold">Welcome!</h2>
                 <p class="text-lg text-gray-400 mt-4">Your video call is in a separate tab.</p>
            </div>
            
            <!-- Each tool's HTML is now directly inside its own div -->
            <div id="flashcards-tool" class="tool-content">
                <!-- All of your approved flashcard HTML would be pasted here -->
                <h1>Flashcards Tool</h1>
            </div>
            <div id="whiteboard-tool" class="tool-content h-full">
                <!-- The whiteboard still works best as an iframe -->
                <iframe src="https://tldraw.com/" class="w-full h-full border-0 bg-white"></iframe>
            </div>
            <div id="translator-tool" class="tool-content">
                <!-- All of your approved translator HTML would be pasted here -->
                <h1>Translator Tool</h1>
            </div>
            <div id="reading-tool" class="tool-content flex items-center justify-center p-8">
                <!-- The Storynory link card HTML would be pasted here -->
                <h1>Reading Tool</h1>
            </div>
             <div id="awards-tool" class="tool-content">
                <!-- All of your approved rewards app HTML would be pasted here -->
                <h1>Awards Tool</h1>
            </div>
            <div id="reports-tool" class="tool-content">
                <!-- All of your approved reports app HTML would be pasted here -->
                <h1>Reports Tool</h1>
            </div>
        </main>
    </div>
    <script>
        function showTool(toolId) {
            document.querySelectorAll('.tool-content').forEach(tool => tool.classList.remove('active'));
            document.getElementById(toolId + '-tool').classList.add('active');
            document.querySelectorAll('.tool-icon').forEach(icon => icon.classList.remove('active'));
            document.querySelector(`button[onclick="showTool('${toolId}')"]`).classList.add('active');
        }

        // All of the JavaScript for flashcards, translator, reports, etc., would be pasted here,
        // with variable names prefixed to avoid conflicts (e.g., fc_decks, tr_recognition).
    </script>
</body>
</html>
