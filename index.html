<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Ian's Class Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .font-handwriting { font-family: 'Patrick Hand', cursive; }
        .bg-classroom { 
            background-color: #1a202c; 
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://i.imgur.com/v8r2MS9.jpg'); 
            background-size: cover; 
            background-position: center;
            background-attachment: fixed;
        }
        .text-shadow { text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8); }
    </style>
</head>
<body class="bg-classroom text-white">
    <div class="min-h-screen flex items-center justify-center">
        <div class="text-center p-10 max-w-2xl mx-4">
            <h1 class="text-6xl lg:text-7xl font-bold mb-2 font-handwriting text-shadow">Mr. Ian's Class Room</h1>
            <p class="text-lg text-gray-200 mb-8 text-shadow">Click the button below to enter your teaching dashboard.</p>
            
            <!-- A simple, unbreakable link to the classroom. -->
            <a href="classroom.html" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-full text-lg transition-transform transform hover:scale-105">
                Enter Classroom
            </a>
        </div>
    </div>
</body>
</html>
