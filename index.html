<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Ian's Class Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .font-handwriting { font-family: 'Patrick Hand', cursive; }
        .bg-classroom { 
            background-color: #1a202c; 
            background-image: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('my-classroom-8953770.jpg'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
        }
        .text-shadow { text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7); }
    </style>
</head>
<body class="bg-classroom text-white">
    <div class="min-h-screen flex items-center justify-center">
        <div class="text-center p-10 max-w-2xl mx-4">
            <h1 class="text-6xl lg:text-7xl font-bold mb-2 font-handwriting text-shadow">Mr. Ian's Class Room</h1>
            <p class="text-lg text-gray-200 mb-8 text-shadow">Click the button below to enter your teaching dashboard.</p>
            <a href="classroom.html" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-full text-lg transition-transform transform hover:scale-105">
                Enter Classroom
            </a>
            <div class="mt-8 p-4 bg-blue-900 bg-opacity-50 rounded-lg">
                <p class="text-sm">💡 <strong>Pro Tip:</strong> Create a Google Meet first, then enter classroom</p>
                <a href="https://meet.google.com/new" target="_blank" class="text-yellow-300 hover:text-yellow-200 underline mt-2 inline-block">
                    Create Google Meet Session
                </a>
            </div>
        </div>
    </div>
</body>
</html>
