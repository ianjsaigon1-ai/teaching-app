<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split-Screen Teaching Mode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #container { display: flex; height: 100vh; width: 100%; }
    iframe { border: none; height: 100vh; }
    #divider {
      width: 6px;
      background-color: #4a5568;
      cursor: col-resize;
    }
    #toolbar {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 6px 14px;
      border-radius: 10px;
      font-family: sans-serif;
      z-index: 1000;
    }
    #toolbar button {
      background: #2b6cb0;
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin: 0 4px;
    }
    #toolbar button:hover { background: #3182ce; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button onclick="goHome()">🏠 Back</button>
    <button onclick="refreshAll()">🔄 Refresh Both</button>
  </div>

  <div id="container">
    <iframe id="left-pane" src="https://meet.jit.si/Mr-Ians-Professional-Classroom-12345" style="width: 50%;"></iframe>
    <div id="divider"></div>
    <iframe id="right-pane" src="classroom.html" style="width: 50%;"></iframe>
  </div>

  <script>
    const divider = document.getElementById('divider');
    const left = document.getElementById('left-pane');
    const right = document.getElementById('right-pane');
    let isDragging = false;

    divider.addEventListener('mousedown', (e) => {
      isDragging = true;
      document.body.style.cursor = 'col-resize';
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
      document.body.style.cursor = 'default';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const totalWidth = window.innerWidth;
      const leftWidth = e.clientX;
      const rightWidth = totalWidth - leftWidth - divider.offsetWidth;
      left.style.width = `${(leftWidth / totalWidth) * 100}%`;
      right.style.width = `${(rightWidth / totalWidth) * 100}%`;
    });

    function goHome() { window.location.href = "index.html"; }
    function refreshAll() {
      left.contentWindow.location.reload();
      right.contentWindow.location.reload();
    }
  </script>
</body>
</html>
