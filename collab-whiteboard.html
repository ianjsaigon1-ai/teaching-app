<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Whiteboard - Ian's QuikT</title>
    <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #1f2937; font-family: Arial, sans-serif; height: 100vh; overflow: hidden; }
        .container { display: flex; flex-direction: column; height: 100vh; }
        .controls { background: #374151; padding: 10px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; border-bottom: 2px solid #4b5563; }
        .color-btn { width: 25px; height: 25px; border-radius: 50%; border: 2px solid #9ca3af; cursor: pointer; }
        .color-btn.active { border-color: white; }
        .btn { background: #6b7280; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        .clear-btn { background: #dc2626; }
        .room-btn { background: #3b82f6; }
        .canvas-container { flex: 1; background: white; position: relative; }
        #whiteboard { display: block; width: 100%; height: 100%; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .modal-content { background: white; padding: 20px; border-radius: 12px; max-width: 400px; width: 90%; }
        .modal-input { width: 100%; padding: 10px; margin: 10px 0; border: 2px solid #e5e7eb; border-radius: 6px; }
        .status { color: white; font-size: 14px; }
    </style>
</head>
<body>
    <!-- Join Room Popup -->
    <div id="roomModal" class="modal">
        <div class="modal-content">
            <h2 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 1rem;">Join Collaborative Whiteboard</h2>
            <input type="text" id="roomIdInput" class="modal-input" placeholder="Room ID" value="classroom1">
            <input type="text" id="userNameInput" class="modal-input" placeholder="Your Name">
            <div style="display: flex; gap: 10px; margin-top: 1rem;">
                <button onclick="joinAsTeacher()" style="flex: 1; background: #dc2626; color: white; padding: 10px; border-radius: 6px; border: none;">Join as Teacher</button>
                <button onclick="joinAsStudent()" style="flex: 1; background: #2563eb; color: white; padding: 10px; border-radius: 6px; border: none;">Join as Student</button>
            </div>
            <p style="font-size: 0.875rem; color: #6b7280; margin-top: 1rem;">
                <strong>Teacher:</strong> Share screen in Jitsi → Students join same room
            </p>
        </div>
    </div>

    <div class="container">
        <div class="controls">
            <div class="status" id="roomInfo">Click "Change Room" to join</div>
            <div style="display: flex; gap: 5px; align-items: center;">
                <span style="color: white; font-size: 12px;">Colors:</span>
                <button class="color-btn active" style="background: #000000;" onclick="setColor('#000000')"></button>
                <button class="color-btn" style="background: #dc2626;" onclick="setColor('#dc2626')"></button>
                <button class="color-btn" style="background: #2563eb;" onclick="setColor('#2563eb')"></button>
                <button class="color-btn" style="background: #16a34a;" onclick="setColor('#16a34a')"></button>
            </div>
            <div style="display: flex; gap: 5px; align-items: center;">
                <span style="color: white; font-size: 12px;">Size:</span>
                <button class="btn active" onclick="setSize(2)">Small</button>
                <button class="btn" onclick="setSize(5)">Medium</button>
                <button class="btn" onclick="setSize(10)">Large</button>
            </div>
            <button class="room-btn" onclick="showRoomModal()">Change Room</button>
            <button class="clear-btn" onclick="clearWhiteboard()">Clear All</button>
        </div>
        
        <div class="canvas-container">
            <canvas id="whiteboard"></canvas>
        </div>
    </div>

    <script>
        // Your Pusher credentials
        const pusher = new Pusher('59a6f0032791160d6c3f', {
            cluster: 'mt1'
        });

        let channel = null;
        let currentRoom = null;
        let userName = '';
        let userType = 'student';
        let userId = Math.random().toString(36).substr(2, 9);
        
        let isDrawing = false;
        let lastX = 0, lastY = 0;
        let currentColor = '#000000';
        let currentSize = 5;
        let canvas, ctx;

        // When page loads
        document.addEventListener('DOMContentLoaded', function() {
            canvas = document.getElementById('whiteboard');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            setupEventListeners();
            
            // Set white background
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            showRoomModal();
        });

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        function setupEventListeners() {
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            window.addEventListener('resize', resizeCanvas);
        }

        function startDrawing(e) {
            if (!currentRoom) {
                alert('Please join a room first!');
                showRoomModal();
                return;
            }
            
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;
            
            // Draw dot
            ctx.beginPath();
            ctx.arc(lastX, lastY, currentSize/2, 0, Math.PI * 2);
            ctx.fillStyle = currentColor;
            ctx.fill();
            
            // Send to others
            sendDrawing({
                type: 'drawStart',
                x: lastX,
                y: lastY,
                color: currentColor,
                size: currentSize
            });
        }

        function draw(e) {
            if (!isDrawing || !currentRoom) return;
            
            const rect = canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;
            
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(currentX, currentY);
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            
            // Send to others
            sendDrawing({
                type: 'draw',
                fromX: lastX,
                fromY: lastY,
                toX: currentX,
                toY: currentY,
                color: currentColor,
                size: currentSize
            });
            
            lastX = currentX;
            lastY = currentY;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function sendDrawing(data) {
            if (!channel) return;
            
            channel.trigger('client-drawing', {
                ...data,
                userId: userId,
                userName: userName
            });
        }

        function joinRoomChannel(roomId) {
            if (channel) {
                channel.unsubscribe();
            }
            
            channel = pusher.subscribe(`presence-${roomId}`);
            
            channel.bind('pusher:subscription_succeeded', () => {
                alert(`Joined room: ${roomId} as ${userName}\n\nTeacher: Share screen in Jitsi\nStudents: Draw to collaborate`);
                updateRoomInfo();
            });
            
            // Listen for other people's drawings
            channel.bind('client-drawing', (data) => {
                if (data.userId !== userId) {
                    drawRemote(data);
                }
            });
        }

        function drawRemote(data) {
            if (data.type === 'drawStart') {
                ctx.beginPath();
                ctx.arc(data.x, data.y, data.size/2, 0, Math.PI * 2);
                ctx.fillStyle = data.color;
                ctx.fill();
            } else if (data.type === 'draw') {
                ctx.beginPath();
                ctx.moveTo(data.fromX, data.fromY);
                ctx.lineTo(data.toX, data.toY);
                ctx.strokeStyle = data.color;
                ctx.lineWidth = data.size;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            }
        }

        function joinAsTeacher() {
            const roomId = document.getElementById('roomIdInput').value || 'classroom1';
            userName = document.getElementById('userNameInput').value || 'Teacher';
            userType = 'teacher';
            joinRoom(roomId);
        }

        function joinAsStudent() {
            const roomId = document.getElementById('roomIdInput').value || 'classroom1';
            userName = document.getElementById('userNameInput').value || 'Student';
            userType = 'student';
            joinRoom(roomId);
        }

        function joinRoom(roomId) {
            currentRoom = roomId;
            joinRoomChannel(roomId);
            hideRoomModal();
        }

        function showRoomModal() {
            document.getElementById('roomModal').style.display = 'flex';
        }

        function hideRoomModal() {
            document.getElementById('roomModal').style.display = 'none';
        }

        function updateRoomInfo() {
            document.getElementById('roomInfo').textContent = 
                `${userName} (${userType}) - Room: ${currentRoom}`;
        }

        function setColor(color) {
            currentColor = color;
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        function setSize(size) {
            currentSize = size;
            document.querySelectorAll('.btn').forEach(btn => {
                if(['Small','Medium','Large'].some(t => btn.textContent.includes(t))) {
                    btn.classList.remove('active');
                }
            });
            event.target.classList.add('active');
        }

        function clearWhiteboard() {
            if (confirm('Clear whiteboard for everyone?')) {
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }
    </script>
</body>
</html>
